name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --verbose
      - name: Run tests
        run: cargo test --verbose -- --no-capture
      - name: Lint code
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy
      - name: Check code style
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Spell check
        if: matrix.os == 'ubuntu-latest'
        uses: crate-ci/typos@v1
      - name: Test f64 build
        run: cargo test --verbose --features use_f64 -- --no-capture
